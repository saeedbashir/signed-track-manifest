[project]
name = "signed-track-manifest"
version = "0.1.0"
description = "Signed Track Manifest (STM): an open format for closed-signing tracks, a validator, and an extraction pipeline that produces it."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Saeed Bashir" }]
keywords = ["accessibility", "sign-language", "closed-signing", "video", "manifest"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "jsonschema>=4.23",
  "numpy>=1.26",
  "opencv-python>=4.10",
  "onnxruntime>=1.19",
  "pyyaml>=6.0",
  "rapidfuzz>=3.0",  # true longest-common-subsequence for caption alignment; difflib is greedy and mis-pins repeated phrases
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "types-jsonschema",
]
aws = [
  "anthropic[bedrock]>=1.7",  # AnthropicBedrockMantle: Claude on the Bedrock Messages endpoint
  "boto3>=1.35",               # S3 sync from the extraction container
]
captions = [
  "faster-whisper>=1.0",  # CTranslate2 Whisper, CPU: a clock for a human transcript, or a machine one where none exists
]

[project.scripts]
validate-stm = "stm.cli:main"
stm = "stm_pipeline.cli:main"

[project.urls]
Homepage = "https://github.com/saeedbashir/signed-track-manifest"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stm", "src/stm_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM", "RUF", "PL"]
ignore = [
  "PLR0913", # many-argument functions are explicit pipeline steps
  "PLR0917",
  "PLR2004", # magic numbers are tuned constants, documented where they sit
  "PLR0911", # the CLI dispatcher returns exit codes from many branches
  "PLR0912",
  "PLR0915",
  "PLC0415", # lazy imports keep `stm --help` fast and let tests run without onnxruntime
  "RUF001", # prose punctuation (dashes, ×, …) in strings is intentional
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests", "harness"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
  "cv2", "cv2.*", "onnxruntime", "onnxruntime.*", "boto3", "boto3.*",
  "anthropic", "anthropic.*", "faster_whisper", "faster_whisper.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs model weights or real media; skipped unless STM_RUN_INTEGRATION=1"]
