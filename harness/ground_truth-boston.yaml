# Ground truth for real broadcasts, Boston City TV, Tier 1 development corpus.
#
# Rectangles read by eye off a coordinate grid rendered over a clean frame of each
# clip (dev-corpus/gt/*-grid.png). They bound the interpreter's video tile at its
# visible border, which in this series is a bright 1-2px line. Accurate to roughly
# +/-8 source pixels: enough to separate a correct window from one twice too tall,
# not enough to tune an edge detector on.
#
# All clips are 120s excerpts. Frames sampled at t=12s except 02, read at t=400s of
# the full file and since trimmed to the 360-480s window that contains it.
#
# Clips are not committed. Paths are relative to this file.
clips:
  - clip: ../../dev-corpus/boston/01.mp4
    rect: {x: 566, y: 0, w: 288, h: 213}
    notes: >-
      Corner inset flush to top and right, plain blue backdrop.
  - clip: ../../dev-corpus/boston/02.mp4
    rect: {x: 537, y: 0, w: 317, h: 237}
    notes: >-
      Outdoor salt-pile event, January. Near-identical staging to 14.
  - clip: ../../dev-corpus/boston/03.mp4
    rect: {x: 528, y: 96, w: 298, h: 200}
    notes: >-
      Remote interpreter tile overlaid on a full-width picture. Triage called this side-panel and zero-fill; the programme continues behind and around the tile, so a crop leaves a hole.
  - clip: ../../dev-corpus/boston/04.mp4
    rect: {x: 527, y: 95, w: 303, h: 202}
    notes: >-
      Letterboxed picture, white-bordered tile overlaid right of centre.
  - clip: ../../dev-corpus/boston/05.mp4
    rect: {x: 500, y: 70, w: 336, h: 227}
    notes: >-
      Outdoor, City Hall. Tile clear of all frame edges.
  - clip: ../../dev-corpus/boston/06.mp4
    rect: {x: 475, y: 58, w: 340, h: 227}
    notes: >-
      Outdoor, City Hall Plaza. Largest tile in the corpus relative to frame.
  - clip: ../../dev-corpus/boston/07.mp4
    rect: {x: 553, y: 0, w: 301, h: 197}
    notes: >-
      Corner inset flush to top and right.
  - clip: ../../dev-corpus/boston/08.mp4
    rect: {x: 481, y: 0, w: 373, h: 236}
