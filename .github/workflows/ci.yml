name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    name: lint, types, tests (uv)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: system deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libgl1 libglib2.0-0
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
      - name: examples validate
        run: |
          uv run validate-stm examples/corner-inset.json examples/side-panel.json
          uv run validate-stm --catalogue examples/catalogue.json
          if uv run validate-stm -q examples/invalid-*.json; then echo "invalid examples passed"; exit 1; fi

  pip-path:
    name: README pip path works
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: system deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libgl1 libglib2.0-0
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: validate-stm examples/corner-inset.json
