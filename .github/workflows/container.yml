name: container

# Builds the extraction image (docker/Dockerfile) and pushes it to the ECR
# repository that the Closed Signing infra creates. The development machine has
# no Docker and Fargate wants linux/amd64, so the image is built here, on the
# runner's architecture, and nowhere else.
#
# Runs only where the two repository variables are set — a fork, or a clone
# before the infra exists, must not fail on this. Credentials come from GitHub's
# OIDC token assumed into an IAM role that can push to one repository prefix;
# there is no long-lived key anywhere.
#
#   AWS_ROLE_ARN     arn:aws:iam::<account>:role/closed-signing-ci-ecr-push
#   ECR_REPOSITORY   the repository *name* (the EcrRepositoryUri output, after the "/")

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - docker/**
      - src/**
      - pyproject.toml
      - requirements.txt
      - .github/workflows/container.yml

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check configuration
        id: check
        env:
          ROLE: ${{ vars.AWS_ROLE_ARN }}
          REPO: ${{ vars.ECR_REPOSITORY }}
        run: |
          if [ -z "$ROLE" ] || [ -z "$REPO" ]; then
            echo "AWS_ROLE_ARN or ECR_REPOSITORY is not set; nothing to push to." >&2
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.check.outputs.ready == 'true'
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        if: steps.check.outputs.ready == 'true'
        id: ecr

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.ready == 'true'

      - uses: docker/build-push-action@v6
        if: steps.check.outputs.ready == 'true'
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:latest
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
